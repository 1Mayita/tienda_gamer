<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <rect width="400" height="280" fill="#0f0f18"/>
  <rect x="1" y="1" width="398" height="278" rx="8" fill="none" stroke="#1e1e2e" stroke-width="2"/>

  <!-- Car body -->
  <g transform="translate(90, 80)">
    <!-- Main body -->
    <rect x="10" y="65" width="200" height="45" rx="6" fill="#1a1a2e"/>
    <!-- Roof -->
    <path d="M45,65 Q65,25 105,18 Q145,10 165,25 L195,65 Z" fill="#16213e"/>
    <!-- Windows -->
    <path d="M55,62 Q70,32 105,24 Q130,18 150,30 L175,62 Z" fill="#0d0d1a" opacity="0.8"/>
    <line x1="115" y1="22" x2="112" y2="62" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="52" cy="110" r="24" fill="#0a0a12" stroke="#2a2a3a" stroke-width="3"/>
    <circle cx="52" cy="110" r="12" fill="#111" stroke="#e8272b" stroke-width="1.5"/>
    <circle cx="52" cy="110" r="4" fill="#e8272b"/>
    <circle cx="168" cy="110" r="24" fill="#0a0a12" stroke="#2a2a3a" stroke-width="3"/>
    <circle cx="168" cy="110" r="12" fill="#111" stroke="#e8272b" stroke-width="1.5"/>
    <circle cx="168" cy="110" r="4" fill="#e8272b"/>
    <!-- Headlight -->
    <rect x="12" y="72" width="28" height="14" rx="3" fill="#c9a84c" opacity="0.7"/>
    <!-- Taillight -->
    <rect x="180" y="72" width="28" height="14" rx="3" fill="#e8272b" opacity="0.7"/>
    <!-- Door line -->
    <line x1="112" y1="67" x2="112" y2="108" stroke="#2a2a3a" stroke-width="1.5"/>
    <!-- Ground shadow -->
    <ellipse cx="110" cy="136" rx="105" ry="6" fill="#000" opacity="0.4"/>
  </g>

  <!-- Brand text -->
  <text x="200" y="32" text-anchor="middle" font-family="'Bebas Neue', sans-serif" font-size="20" fill="#e8272b" opacity="0.6" letter-spacing="3">AUTOZONE</text>
  <!-- Sub text -->
  <text x="200" y="256" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#444" letter-spacing="1">Sin imagen disponible</text>

  <!-- Corner accents -->
  <line x1="0" y1="0" x2="30" y2="0" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="30" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="0" x2="370" y2="0" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="30" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="280" x2="30" y2="280" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="280" x2="0" y2="250" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="280" x2="370" y2="280" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="280" x2="400" y2="250" stroke="#e8272b" stroke-width="2" opacity="0.4"/>
</svg>
